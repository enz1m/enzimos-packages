# Candidate profile: explicit installation/loading requires fresh guest qualification.
abi <abi/4.0>,
include <tunables/global>
profile enzimos-restic-points flags=(attach_disconnected) {
  include <abstractions/base>
  /usr/bin/restic mrix,
  /etc/{passwd,group,nsswitch.conf,machine-id} r,
  owner @{PROC}/@{pid}/{cgroup,mountinfo} r,
  /backup-repository/ r,
  /backup-repository/** r,
  /etc/enzimos/backup.password r,
  /run/enzimos/ r,
  /sys/kernel/mm/transparent_hugepage/hpage_pmd_size r,
  capability dac_read_search,
  capability dac_override,
  audit deny network,
  audit deny /etc/shadow r,
  deny /backup-repository/** wklx,
  deny /run/enzimos/** wklx,
  deny /tmp/** wklx,
  deny /var/tmp/** wklx,
  deny /backup-source/** rwklx,
  deny /restore-target/** rwklx,
  deny /root/** rwklx,
  deny /etc/enzimos/backup.next-password r,
  deny /etc/enzimos/backup.{rotation-password,retired-password} r,
  deny /etc/enzimos/backup{-remote,-remote-rotation,-remote-retired}.password r,
}
