# Inert Rust candidate; fresh guest loading/qualification required.
abi <abi/4.0>,
include <tunables/global>
profile enzimos-restic-native-retrieve flags=(attach_disconnected) {
  include <abstractions/base>
  /usr/bin/restic mrix,
  /etc/{passwd,group,nsswitch.conf,machine-id} r,
  owner @{PROC}/@{pid}/{cgroup,mountinfo} r,
  /backup-repository/ r,
  /backup-repository/restic/** r,
  /backup-repository/restic/{data,index,locks,snapshots}/** rwk,
  /backup-remote/ r,
  /backup-remote/** r,
  /backup-remote/**/locks/{,**} rwk,
  /run/enzimos/ rw,
  /run/enzimos/** rwk,
  /etc/enzimos/{backup.password,backup-remote.password} r,
  /sys/kernel/mm/transparent_hugepage/hpage_pmd_size r,
  capability dac_override,
  # The kernel SMB client reaches the NAS; Restic itself has no network.
  audit deny network,
  audit deny /etc/shadow r,
  deny /etc/enzimos/backup-remote.share-password r,
  deny /etc/enzimos/{backup-remote.identity,backup-remote.hosts} r,
  deny /backup-source/** rwklx,
  deny /restore-target/** rwklx,
  deny /root/** rwklx,
}
