# Inert candidate; explicit guest loading and fresh qualification are required.
abi <abi/4.0>,
include <tunables/global>
profile enzimos-restic-native-rotation-prepare flags=(attach_disconnected) {
  include <abstractions/base>
  /usr/bin/restic mrix,
  /etc/{passwd,group,nsswitch.conf,machine-id} r,
  owner @{PROC}/@{pid}/{cgroup,mountinfo} r,
  /backup-repository/ r,
  /backup-repository/restic/ r,
  /backup-repository/restic/** r,
  deny /backup-repository/restic/** wklx,
  /backup-repository/restic-rotation/ rw,
  /backup-repository/restic-rotation/** rwk,
  /run/enzimos/backup-native/jobs/*/scratch/ rw,
  /run/enzimos/backup-native/jobs/*/scratch/** rwk,
  /etc/enzimos/{backup.password,backup.rotation-password} r,
  /sys/kernel/mm/transparent_hugepage/hpage_pmd_size r,
  capability dac_override,
  audit deny network,
  audit deny /etc/shadow r,
  deny /backup-source/** rwklx,
  deny /restore-target/** rwklx,
  deny /root/** rwklx,
}
