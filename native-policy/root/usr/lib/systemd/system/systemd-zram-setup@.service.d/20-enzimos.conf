# udev watches zram devices (60-block.rules OPTIONS+="watch"). When swapoff
# closes /dev/zramN, udevd synthesizes a "change" event and probes the device.
# The kernel refuses a reset while the device is open (EBUSY) and refuses that
# probe's open while a reset holds it, so the stop races udev at shutdown.
# Let udev finish pending events first, and retry a refused reset a bounded
# number of times; a reset that still fails fails this unit as before.
[Service]
ExecStop=
ExecStop=/usr/bin/sh -c 'for attempt in 1 2 3; do /usr/bin/udevadm settle --timeout=5 || :; /usr/lib/systemd/system-generators/zram-generator --reset-device "$$1" && exit 0; done; exit 1' zram-reset %i
