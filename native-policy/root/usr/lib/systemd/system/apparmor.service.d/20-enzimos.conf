[Service]
# Read our reviewed profile bytes even when reproducible mtimes match an older cache.
ExecStartPost=/usr/bin/apparmor_parser --skip-read-cache --replace /etc/apparmor.d/enzimos-restic
ExecReload=/usr/bin/apparmor_parser --skip-read-cache --replace /etc/apparmor.d/enzimos-restic
