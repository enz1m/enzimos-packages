; SPDX-License-Identifier: MIT
; enzimOS defaults, merged before /etc/gamemode.ini and the user's own file.
[general]
; power-profiles-daemon owns CPU policy: the governor helper is refused by
; polkit, and the performance profile is held through PPD while active.
igpu_power_threshold=-1

[custom]
start=/usr/lib/enzimos/gamemode-performance start
end=/usr/lib/enzimos/gamemode-performance end
script_timeout=10
