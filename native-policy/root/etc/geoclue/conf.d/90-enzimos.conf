# The enzUI agent grants location access and limits the accuracy per app.
# Nearby Wi-Fi identifiers are queried only when precise location is enabled.

[agent]
whitelist=enzui-location-agent

[ip]
enable=true
method=ichnaea
url=https://api.beacondb.net/v1/geolocate

[wifi]
enable=true
url=https://api.beacondb.net/v1/geolocate
submit-data=false

[compass]
enable=false
