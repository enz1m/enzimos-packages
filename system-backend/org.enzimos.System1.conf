<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="org.enzimos.System1"/></policy>
  <policy context="default">
    <deny own="org.enzimos.System1"/>
    <allow send_destination="org.enzimos.System1" send_interface="org.enzimos.System1" send_member="GetCapabilities"/>
    <allow send_destination="org.enzimos.System1" send_interface="org.enzimos.System1" send_member="Execute"/>
    <allow send_destination="org.enzimos.System1" send_interface="org.enzimos.System1" send_member="Job"/>
    <allow send_destination="org.enzimos.System1" send_interface="org.enzimos.System1" send_member="Operation"/>
    <allow send_destination="org.enzimos.System1" send_interface="org.enzimos.System1" send_member="Query"/>
    <allow send_destination="org.enzimos.System1" send_interface="org.enzimos.System1" send_member="InspectBackgroundBroker"/>
    <allow send_destination="org.enzimos.System1" send_interface="org.enzimos.System1" send_member="LoginAppearance"/>
    <allow send_destination="org.enzimos.System1" send_interface="org.enzimos.System1" send_member="BackupSetupControl"/>
    <allow send_destination="org.enzimos.System1" send_interface="org.enzimos.System1" send_member="BackupSetupInput"/>
    <allow send_destination="org.enzimos.System1" send_interface="org.enzimos.System1" send_member="BackupRecoveryExport"/>
    <allow send_destination="org.enzimos.System1" send_interface="org.enzimos.System1" send_member="BackupRecoveryConfirm"/>
    <allow send_destination="org.enzimos.System1" send_interface="org.enzimos.System1" send_member="BackupRemoteShare"/>
    <allow send_destination="org.enzimos.System1" send_interface="org.enzimos.System1" send_member="BackupRemoteShareSetup"/>
  </policy>
</busconfig>
