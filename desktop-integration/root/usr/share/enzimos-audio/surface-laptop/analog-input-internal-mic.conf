.include /usr/share/alsa-card-profile/mixer/paths/analog-input-internal-mic.conf

[Element Capture]
; The ALC298 Capture stage is -33.5 dB + 0.5 dB per step; step 115 is +24 dB.
; The stock path reached +60 dB with the boost stage and clipped room noise at 100%.
; +24 dB keeps headroom for speech while staying usable as the slider's top.
volume-limit = 115

[Element Internal Mic Boost]
volume = zero
