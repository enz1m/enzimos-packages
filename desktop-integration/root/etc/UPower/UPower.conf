# enzimOS desktop defaults. UPower owns the critical action; the shell only warns.
# Ordinary desktop preferences must not race a second shutdown/suspend scheduler.
[UPower]
UsePercentageForPolicy=true
PercentageLow=10.0
PercentageCritical=5.0
PercentageAction=3.0
# Safe capability-based action: hybrid sleep, hibernate, then power off.
# Suspend alone needs an explicit administrator opt-in (it can lose RAM on depletion).
CriticalPowerAction=Auto
AllowRiskyCriticalPowerAction=false
